<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr M Khan Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D viewport; slim title bar on top, control dock and room card at the bottom. */
:root{
  --bg:#e9edee; --panel:rgba(251,252,252,.94); --fg:#16202a; --muted:#56626e; --line:#ccd3d8;
  --accent:#1d4ed8; --accent-fg:#ffffff; --signal:#c2570c; --chip:#eef1f3; --chip-on:#16202a; --chip-on-fg:#f4f6f7;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:rgba(20,27,34,.94); --fg:#e7ecf0; --muted:#97a3ae; --line:#2b353e;
  --accent:#7ba2ff; --accent-fg:#0a1220; --signal:#f19a52; --chip:#1d262e; --chip-on:#e7ecf0; --chip-on-fg:#0e1318; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:rgba(20,27,34,.94); --fg:#e7ecf0; --muted:#97a3ae; --line:#2b353e;
  --accent:#7ba2ff; --accent-fg:#0a1220; --signal:#f19a52; --chip:#1d262e; --chip-on:#e7ecf0; --chip-on-fg:#0e1318; color-scheme:dark;}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.title{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;backdrop-filter:blur(8px)}
.title b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em}
.title span{display:block;color:var(--muted);font-family:var(--font-data);font-size:11px;margin-top:2px}
.iconbtn{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;white-space:nowrap}
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;
  padding-top:8px;padding-bottom:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
#dock>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#info{padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
#info .nm{font-weight:600;font-size:14px}
#info .meta{font-family:var(--font-data);font-size:11.5px;color:var(--muted);margin-top:2px}
#info .tag{font-family:var(--font-data);font-size:11px;color:var(--signal);white-space:nowrap}
#panel{padding:8px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.row::-webkit-scrollbar{display:none}
.lab{font-family:var(--font-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:0 0 auto;min-width:46px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 12px;font-size:13px;line-height:1}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.chip.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.sl{display:flex;align-items:center;gap:8px;flex:1 1 140px;min-width:130px}
.sl input{flex:1;min-width:0;accent-color:var(--accent)}
.sl output{font-family:var(--font-data);font-size:11px;color:var(--muted);min-width:34px;text-align:right}
#more[hidden]{display:none!important}
#toggleMore{align-self:flex-end}
#joy{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);touch-action:none}
#stick{position:absolute;left:34px;top:34px;width:58px;height:58px;border-radius:50%;background:var(--accent);opacity:.9}
#walkHud{position:absolute;left:0;right:0;top:64px;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
#walkHud .card{padding:8px 12px;font-size:13px;text-align:center}
#walkHud small{display:block;color:var(--muted);font-family:var(--font-data);font-size:11px;margin-top:2px}
#exitWalk{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
.walking #dock{display:none}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Interactive 3D model of the Dr M Khan Home plan"></canvas>
  <div class="bar">
    <div class="title"><b>Dr M Khan Home</b><span>Soomro Revised-01 · Masson Road, Dadu · 30′ × 60′</span></div>
    <button class="iconbtn" id="btnReset" type="button">Reset view</button>
  </div>
  <div id="walkHud" hidden><div class="card"><div id="walkRoom">Entrance</div><small>Drag to look · joystick or WASD to move</small></div></div>
  <div id="joy" hidden><div id="stick"></div></div>
  <button class="iconbtn chip go" id="exitWalk" type="button" hidden>Exit walk</button>
  <section id="dock" aria-label="Controls">
    <div class="card" id="info"><div><div class="nm" id="infoName">Tap any room</div><div class="meta" id="infoMeta">Drag to orbit · pinch to zoom · two fingers to pan</div></div><div class="tag" id="infoTag"></div></div>
    <div class="card" id="panel">
      <div class="row" id="rowView"><span class="lab">View</span>
        <button class="chip" type="button" data-view="iso" aria-pressed="true">3D</button>
        <button class="chip" type="button" data-view="top" aria-pressed="false">Plan</button>
        <button class="chip" type="button" data-view="front" aria-pressed="false">Front</button>
        <button class="chip" type="button" data-view="side" aria-pressed="false">Side</button>
        <button class="chip go" type="button" id="btnWalk">Walk inside</button>
      </div>
      <div id="more">
        <div class="row" id="rowFloor"><span class="lab">Floor</span>
          <button class="chip" type="button" data-floor="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-floor="ground" aria-pressed="false">Ground</button>
          <button class="chip" type="button" data-floor="first" aria-pressed="false">First</button>
        </div>
        <div class="row" id="rowTog" style="margin-top:8px"><span class="lab">Layers</span>
          <button class="chip" type="button" data-tog="roof" aria-pressed="true">Roof</button>
          <button class="chip" type="button" data-tog="labels" aria-pressed="true">Labels</button>
          <button class="chip" type="button" data-tog="furn" aria-pressed="true">Furniture</button>
          <button class="chip" type="button" data-tog="xray" aria-pressed="false">X-ray</button>
          <button class="chip" type="button" data-tog="night" aria-pressed="false">Night</button>
        </div>
        <div class="row" style="margin-top:8px;flex-wrap:wrap;overflow:visible">
          <label class="sl"><span class="lab" style="min-width:0">Explode</span><input id="slEx" type="range" min="0" max="1" step="0.01" value="0"><output id="outEx">0%</output></label>
          <label class="sl"><span class="lab" style="min-width:0">Cut</span><input id="slCut" type="range" min="1" max="27" step="0.5" value="27"><output id="outCut">off</output></label>
        </div>
      </div>
      <button class="chip" id="toggleMore" type="button" aria-expanded="true">Fewer controls</button>
    </div>
  </section>
  <div id="fail" hidden>The 3D engine could not load. Check your connection and reload.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('fail').hidden=false;return;}
var T=THREE;
/* ---------- constants (feet) ---------- */
var L0=1.5, L1=12.5, H=10.5, L2=23, TE=0.75, TI=0.5;
var $=function(id){return document.getElementById(id);};
var cvs=$('c');
var renderer=new T.WebGLRenderer({canvas:cvs,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputEncoding=T.sRGBEncoding; renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=0.85;
var clip=new T.Plane(new T.Vector3(0,-1,0),999);
renderer.clippingPlanes=[clip];
var scene=new T.Scene();
var cam=new T.PerspectiveCamera(42,1,0.5,800);
var root=new T.Group(); root.position.set(-15,0,-30); scene.add(root);   // plan coords: x east, y toward the road
var G={site:new T.Group(),ground:new T.Group(),first:new T.Group(),roof:new T.Group()};
for(var k in G) root.add(G[k]);

/* ---------- materials ---------- */
var mats={};
function M(name,color,o){ if(!mats[name]) mats[name]=new T.MeshStandardMaterial(Object.assign({color:color,roughness:0.88,metalness:0},o||{})); return mats[name]; }
M('wall',0xd8d5cd); M('slab',0xb9bbb9); M('plinth',0xa7aaa8); M('roofslab',0xa9adad); M('parapet',0xd9d6cf);
M('glass',0xa6d4ea,{transparent:true,opacity:0.34,roughness:0.08,metalness:0.1,depthWrite:false,emissive:0x000000});
M('frame',0x3a4149); M('door',0x7a5a3c); M('glassdoor',0x8fc3de,{transparent:true,opacity:0.5,depthWrite:false});
M('wood',0x8d6b49); M('fab',0x3f566e); M('wh',0xf0f0ed); M('dk',0x2a3037); M('car',0x9ca5ae); M('plant',0x5c8a4c);
M('step',0xb4b5b2); M('rail',0x4a525b); M('tank',0x1f4f8a); M('gate',0x2c3238);
var shellMats=[mats.wall,mats.slab,mats.plinth,mats.roofslab,mats.parapet];

var PICK=[], FLOORS=[], COL=[], DOORS=[], ROOMS=[];
function pbox(g,x1,y1,x2,y2,z1,z2,m,o){
  var mesh=new T.Mesh(new T.BoxGeometry(x2-x1,z2-z1,y2-y1),m);
  mesh.position.set((x1+x2)/2,(z1+z2)/2,(y1+y2)/2);
  if(!o||o.shadow!==false){mesh.castShadow=true;mesh.receiveShadow=true;}
  g.add(mesh); if(!o||o.pick!==false) PICK.push(mesh); return mesh;
}
/* axis-aligned wall with door and window holes. c = distance of the hole centre from the wall start */
function wall(g,x1,y1,x2,y2,z0,h,t,holes,m){
  holes=holes||[]; m=m||mats.wall;
  var hz=Math.abs(y2-y1)<1e-6;
  var base=hz?Math.min(x1,x2):Math.min(y1,y2), end=hz?Math.max(x1,x2):Math.max(y1,y2);
  var c=hz?y1:x1, a=base-t/2, b=end+t/2;
  function piece(u1,u2,za,zb,solid){
    if(u2-u1<0.01||zb-za<0.01) return;
    if(hz) pbox(g,u1,c-t/2,u2,c+t/2,za,zb,m); else pbox(g,c-t/2,u1,c+t/2,u2,za,zb,m);
    if(solid) COL.push({x1:hz?u1:c-t/2,y1:hz?c-t/2:u1,x2:hz?u2:c+t/2,y2:hz?c+t/2:u2,z1:za,z2:zb});
  }
  var hs=holes.map(function(o){return {u1:base+o.c-o.w/2,u2:base+o.c+o.w/2,o:o,sill:o.sill||0,head:o.head||7};}).sort(function(p,q){return p.u1-q.u1;});
  var cur=a;
  hs.forEach(function(q){
    piece(cur,q.u1,z0,z0+h,true);
    if(q.sill>0) piece(q.u1,q.u2,z0,z0+q.sill,true);
    if(q.head<h) piece(q.u1,q.u2,z0+q.head,z0+h,false);
    cur=q.u2;
    var o=q.o;
    if(o.win){
      var gt=0.1, fr=0.14, ft=Math.min(t*0.7,0.4), zs=z0+q.sill, zh=z0+q.head;
      var P=function(u1,u2,za,zb,mm,tt){ if(hz) pbox(g,u1,c-tt/2,u2,c+tt/2,za,zb,mm,{pick:false,shadow:mm!==mats.glass}); else pbox(g,c-tt/2,u1,c+tt/2,u2,za,zb,mm,{pick:false,shadow:mm!==mats.glass}); };
      P(q.u1,q.u2,zs,zh,mats.glass,gt);
      P(q.u1,q.u2,zs,zs+fr,mats.frame,ft); P(q.u1,q.u2,zh-fr,zh,mats.frame,ft);
      P(q.u1,q.u1+fr,zs,zh,mats.frame,ft); P(q.u2-fr,q.u2,zs,zh,mats.frame,ft);
      P((q.u1+q.u2)/2-fr/2,(q.u1+q.u2)/2+fr/2,zs,zh,mats.frame,ft);
    }
    if(o.door){
      var leaves=o.dbl?[[q.u1,1,o.w/2],[q.u2,-1,o.w/2]]:[[(o.hinge==='b')?q.u2:q.u1,(o.hinge==='b')?-1:1,o.w]];
      leaves.forEach(function(L){
        var piv=new T.Group(), lw=L[2]-0.12;
        piv.position.set(hz?L[0]:c,z0,hz?c:L[0]);
        var leaf=new T.Mesh(new T.BoxGeometry(hz?lw:0.14,6.9,hz?0.14:lw),o.glassDoor?mats.glassdoor:mats.door);
        leaf.position.set(hz?L[1]*lw/2:0,3.45,hz?0:L[1]*lw/2); leaf.castShadow=!o.glassDoor;
        piv.add(leaf); g.add(piv);
        DOORS.push({piv:piv,k:(o.dir||1)*L[1],x:hz?(q.u1+q.u2)/2:c,y:hz?c:(q.u1+q.u2)/2,z:z0,open:0,max:1.3});
      });
    }
  });
  piece(cur,b,z0,z0+h,true);
}
var Wn=function(c,w,sill,h){return {c:c,w:w,sill:sill==null?3:sill,head:(sill==null?3:sill)+(h==null?4:h),win:1};};
var Dr=function(c,w,dir,hinge,glass){return {c:c,w:w||3,sill:0,head:7,door:1,dir:dir||1,hinge:hinge||'a',glassDoor:glass};};
var DD=function(c,w,glass){return {c:c,w:w,sill:0,head:7,door:1,dbl:1,dir:1,glassDoor:glass};};

function slab(g,x1,y1,x2,y2,z1,z2,holes,m){
  var s=new T.Shape(); s.moveTo(x1,-y1); s.lineTo(x2,-y1); s.lineTo(x2,-y2); s.lineTo(x1,-y2); s.closePath();
  (holes||[]).forEach(function(poly){ var p=new T.Path(); poly.forEach(function(pt,i){ if(i===0)p.moveTo(pt[0],-pt[1]); else p.lineTo(pt[0],-pt[1]); }); p.closePath(); s.holes.push(p); });
  var geo=new T.ExtrudeGeometry(s,{depth:z2-z1,bevelEnabled:false}); geo.rotateX(-Math.PI/2);
  var mesh=new T.Mesh(geo,m); mesh.position.y=z1; mesh.castShadow=true; mesh.receiveShadow=true; g.add(mesh); PICK.push(mesh); return mesh;
}
var rect=function(a,b,c,d){return [[a,b],[c,b],[c,d],[a,d]];};

/* ---------- site ---------- */
var siteMat=new T.MeshStandardMaterial({color:0xc3c7bf,roughness:1});
var ground=new T.Mesh(new T.PlaneGeometry(260,260),siteMat); ground.rotation.x=-Math.PI/2; ground.position.set(15,-0.06,30); ground.receiveShadow=true; G.site.add(ground);
var roadMat=new T.MeshStandardMaterial({color:0x494e54,roughness:1});
var road=new T.Mesh(new T.PlaneGeometry(260,16),roadMat); road.rotation.x=-Math.PI/2; road.position.set(15,-0.04,72); road.receiveShadow=true; G.site.add(road);
var walkMat=new T.MeshStandardMaterial({color:0xaab0aa,roughness:1});
var walk=new T.Mesh(new T.PlaneGeometry(260,4),walkMat); walk.rotation.x=-Math.PI/2; walk.position.set(15,-0.03,62); walk.receiveShadow=true; G.site.add(walk);
for(var dx=-60;dx<=90;dx+=9){ pbox(G.site,dx,71.8,dx+4,72.2,-0.02,0.01,new T.MeshBasicMaterial({color:0xe8e2c4}),{pick:false,shadow:false}); }
var plotLine=new T.LineLoop(new T.BufferGeometry().setFromPoints([new T.Vector3(0,0.03,0),new T.Vector3(30,0.03,0),new T.Vector3(30,0.03,60),new T.Vector3(0,0.03,60)]),new T.LineBasicMaterial({color:0x1d4ed8})); G.site.add(plotLine);

/* ---------- ground floor ---------- */
var g0=G.ground, F0=new T.Group(); g0.add(F0);
var plinthShape=new T.Shape();
[[0,0],[30,0],[30,60],[21.5,60],[21.5,54],[15,54],[15,60],[14.5,60],[14.5,57],[4.5,57],[4.5,60],[0,60]].forEach(function(p,i){ if(i===0)plinthShape.moveTo(p[0],-p[1]); else plinthShape.lineTo(p[0],-p[1]); });
plinthShape.closePath();
var plGeo=new T.ExtrudeGeometry(plinthShape,{depth:L0,bevelEnabled:false}); plGeo.rotateX(-Math.PI/2);
var plinth=new T.Mesh(plGeo,mats.plinth); plinth.receiveShadow=true; plinth.castShadow=true; g0.add(plinth); PICK.push(plinth);
function wedgeY(x1,x2,yTop,yBot,zTop){ // ramp rising from yBot (z 0) to yTop (z zTop)
  var s=new T.Shape(); s.moveTo(yTop,0); s.lineTo(yBot,0); s.lineTo(yTop,zTop); s.closePath();
  var geo=new T.ExtrudeGeometry(s,{depth:x2-x1,bevelEnabled:false}); geo.rotateY(-Math.PI/2);
  var m=new T.Mesh(geo,mats.step); m.position.x=x2; m.castShadow=true; m.receiveShadow=true; g0.add(m); }
wedgeY(4.5,14.5,57,60,1.5);            // car ramp
wedgeY(15,17.8,54,60,1.5);             // wheelchair ramp
[[58,0.5],[56,1.0],[54,1.5]].forEach(function(s){ pbox(g0,17.8,s[0]-(s[0]===54?0:0),21.5,s[0]+2,0,s[1],mats.step); }); // three entrance steps
/* ground walls */
var gz=L0;
wall(g0,0,TE/2,30,TE/2,gz,H,TE,[Wn(3.5,1.5,5,2),Wn(20.5,5,3,5)]);                                   // north
wall(g0,TE/2,0,TE/2,60,gz,H,TE,[Wn(11,4,3,4.5),Wn(33,4,3,4.5),Wn(42,1.5,5,2),Wn(51,2,4,3)]);          // west
wall(g0,30-TE/2,0,30-TE/2,60,gz,H,TE,[Wn(24,5,3,5),Wn(39,3,3,4),Wn(47.5,1.5,5,2),Wn(55.5,2.5,4.5,3)]); // east
wall(g0,0,60-TE/2,4.5,60-TE/2,gz,H,TE,[Dr(2.25,3,-1)]);                                                // stair lobby door (front)
wall(g0,21,60-TE/2,30,60-TE/2,gz,H,TE,[Wn(4.5,3,4,3)]);                                                // store front
wall(g0,7,0.75,7,4,gz,H,TI);
wall(g0,0,4,14.5,4,gz,H,TI,[Dr(3.5,2.5,1)]);
wall(g0,14.5,0,14.5,60,gz,H,TI,[Dr(16.5,3,1),Dr(22.5,3,-1),Dr(37,3,1,'b'),Dr(42,3,-1)]);
wall(g0,14.5,15,30,15,gz,H,TI,[Dr(3.5,3,1)]);
wall(g0,27.5,0,27.5,15,gz,H,TI);
wall(g0,27.5,7,29.6,7,gz,H,TI);
wall(g0,0,18.5,14.5,18.5,gz,H,TI);
wall(g0,4.5,18.5,4.5,26.7,gz,H,TI);
wall(g0,0,26.7,14.5,26.7,gz,H,TI);
wall(g0,0,39.75,14.5,39.75,gz,H,TI);
wall(g0,0,44,4.5,44,gz,5,TI);                                   // toilet under the landing
wall(g0,4.5,39.75,4.5,43.75,gz,5,TI,[Dr(2,2.5,1)]);
wall(g0,4.5,43.75,4.5,59.625,gz,H,TI);                          // stair lobby / car porch
wall(g0,4.5,43.75,14.5,43.75,gz,H,TI);
wall(g0,21,34.5,29.6,34.5,gz,H,TI,[Dr(3,3,1)]);
wall(g0,21,34.5,21,43.5,gz,H,TI);
wall(g0,21,43.5,29.6,43.5,gz,H,TI);

var S={floor:'all',roof:true,labels:true,furn:true,xray:false,night:false,ex:0,cut:27};
var skyDay=0xd6e3ec, skyNight=0x0b1118;
function applyState(){
  G.ground.visible=S.floor!=='first'; G.first.visible=S.floor!=='ground'; G.roof.visible=S.roof&&S.floor!=='ground';
  labG0.visible=labG1.visible=labSite.visible=S.labels; F0.visible=F1.visible=S.furn;
  shellMats.forEach(function(m){ m.transparent=S.xray; m.opacity=S.xray?0.2:1; m.depthWrite=!S.xray; m.needsUpdate=true; });
  g1.position.y=S.ex*16; g2.position.y=S.ex*32;
  clip.constant=S.cut>=27?999:S.cut;
  var n=S.night;
  scene.background=new T.Color(n?skyNight:skyDay); scene.fog=new T.Fog(n?skyNight:skyDay,n?160:240,n?420:520);
  hemi.intensity=n?0.22:0.55; amb.intensity=n?0.12:0.16; sun.intensity=n?0.18:0.85; sun.color.set(n?0x9fb4ff:0xfff3e0);
  lamps.forEach(function(l){l.intensity=n?0.9:0;});
  mats.glass.emissive.set(n?0xffb25a:0x000000); mats.glass.emissiveIntensity=n?0.6:0;
  siteMat.color.set(n?0x1c232a:0xc3c7bf); roadMat.color.set(n?0x14181c:0x494e54); walkMat.color.set(n?0x2a3239:0xaab0aa);
}

/* ---------- orbit camera ---------- */
var orb={tx:0,ty:7,tz:2,th:0.62,ph:1.02,r:112}, vth=0, vph=0, tw=null, walking=false;
var PRE={iso:{th:0.62,ph:1.02,r:112,tx:0,ty:7,tz:2},top:{th:0,ph:0.035,r:104,tx:0,ty:0,tz:2},front:{th:0,ph:1.46,r:112,tx:0,ty:9,tz:2},side:{th:1.5708,ph:1.46,r:112,tx:0,ty:9,tz:2}};
function placeOrbit(){
  var sp=Math.sin(orb.ph);
  cam.position.set(orb.tx+orb.r*sp*Math.sin(orb.th),orb.ty+orb.r*Math.cos(orb.ph),orb.tz+orb.r*sp*Math.cos(orb.th));
  cam.rotation.order='XYZ'; cam.lookAt(orb.tx,orb.ty,orb.tz);
}
function fitR(r){ return r*Math.max(1,0.72/Math.max(cam.aspect,0.3)); }
function flyTo(t,ms){
  var d=((t.th-orb.th+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  tw={f:{th:orb.th,ph:orb.ph,r:orb.r,tx:orb.tx,ty:orb.ty,tz:orb.tz},t:{th:orb.th+d,ph:t.ph,r:fitR(t.r),tx:t.tx,ty:t.ty,tz:t.tz},t0:performance.now(),ms:ms||850}; vth=vph=0;
}
function stepTween(now){
  if(!tw) return; var u=Math.min(1,(now-tw.t0)/tw.ms), e=1-Math.pow(1-u,3);
  ['th','ph','r','tx','ty','tz'].forEach(function(k){ orb[k]=tw.f[k]+(tw.t[k]-tw.f[k])*e; }); if(u>=1) tw=null;
}
function clampOrbit(){ orb.ph=Math.max(0.02,Math.min(1.55,orb.ph)); orb.r=Math.max(14,Math.min(260,orb.r)); orb.tx=Math.max(-40,Math.min(40,orb.tx)); orb.tz=Math.max(-30,Math.min(60,orb.tz)); orb.ty=Math.max(-2,Math.min(30,orb.ty)); }
function pan(dx,dy){
  var r=new T.Vector3().setFromMatrixColumn(cam.matrix,0), u=new T.Vector3().setFromMatrixColumn(cam.matrix,1), s=orb.r*0.0016;
  orb.tx+=(-r.x*dx+u.x*dy)*s; orb.ty+=(-r.y*dx+u.y*dy)*s; orb.tz+=(-r.z*dx+u.z*dy)*s; clampOrbit();
}

/* ---------- walking ---------- */
var P={x:17.75,y:66,z:0,yaw:0,pitch:0}, keys={}, joy={x:0,y:0};
function groundH(x,y){
  if(y>60.05||x<0||x>30||y<0) return 0;
  if(x>=4.5&&x<=14.5&&y>57) return 1.5*(60-y)/3;
  if(x>=15&&x<=17.8&&y>54) return 1.5*(60-y)/6;
  if(x>17.8&&x<=21.5&&y>54) return Math.min(1.5,Math.ceil((60-y)/2)*0.5);
  if(x<4.5&&y>58) return 1.5*(60-y)/2;
  return L0;
}
function stairH(x,y){
  if(x>=0.75&&x<4.5&&y>=44&&y<=58) return 7-5.5*(y-44)/14;
  if(x>=0.75&&x<4.5&&y>=39.75&&y<44) return 7;
  if(x>=4.5&&x<=11.5&&y>=39.75&&y<=43.75) return 7+5.5*(x-4.5)/7;
  return null;
}
function surfaceH(x,y,z){ var s=stairH(x,y); if(s!==null&&Math.abs(z-s)<2.2) return s; if(z>9.8) return L1; return groundH(x,y); }
function resolve(x,y,z){
  var R=1.0;
  for(var it=0;it<3;it++){
    for(var i=0;i<COL.length;i++){
      var c=COL[i]; if(z+5.4<=c.z1+0.05||z>=c.z2-0.3) continue;
      var cx=Math.max(c.x1,Math.min(x,c.x2)), cy=Math.max(c.y1,Math.min(y,c.y2)), dx=x-cx, dy=y-cy, d2=dx*dx+dy*dy;
      if(d2<R*R){
        if(d2<1e-8){ var l=x-c.x1,r=c.x2-x,t=y-c.y1,b=c.y2-y,m=Math.min(l,r,t,b); if(m===l)x=c.x1-R; else if(m===r)x=c.x2+R; else if(m===t)y=c.y1-R; else y=c.y2+R; }
        else { var d=Math.sqrt(d2); x=cx+dx/d*R; y=cy+dy/d*R; }
      }
    }
  }
  x=Math.max(-8,Math.min(38,x)); y=Math.max(-8,Math.min(72,y)); return [x,y];
}
function roomAt(x,y,lvl){
  for(var i=0;i<ROOMS.length;i++){ var rm=ROOMS[i]; if(rm.lvl!==lvl) continue; for(var j=0;j<rm.r.length;j++){ var r=rm.r[j]; if(x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3]) return rm; } }
  return null;
}
var lastRoom='';
function walkStep(dt){
  var mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x, my=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+joy.y;
  if(keys.q) P.yaw-=dt*1.6; if(keys.e) P.yaw+=dt*1.6;
  var len=Math.hypot(mx,my); if(len>1){mx/=len;my/=len;}
  var sp=7.5*dt, fx=Math.sin(P.yaw), fy=-Math.cos(P.yaw), rx=Math.cos(P.yaw), ry=Math.sin(P.yaw);
  var nx=P.x+(fx*my+rx*mx)*sp, ny=P.y+(fy*my+ry*mx)*sp, res=resolve(nx,ny,P.z); P.x=res[0]; P.y=res[1];
  var tz=surfaceH(P.x,P.y,P.z); P.z+=(tz-P.z)*Math.min(1,dt*10);
  cam.rotation.order='YXZ'; cam.position.set(P.x-15,P.z+5.2,P.y-30); cam.rotation.set(P.pitch,-P.yaw,0);
  var lvl=P.z>9.8?1:0, rm=roomAt(P.x,P.y,lvl), nm=(rm?rm.n:(P.y>60.3?'Masson Road':(P.x>=14.5&&P.x<=21.5&&P.y>=50?'Entrance':(P.x<4.5&&P.y>=44?'Staircase':'Outside'))))+' · '+(lvl?'First floor':(P.z<1?'Street level':'Ground floor'));
  if(nm!==lastRoom){ lastRoom=nm; $('walkRoom').textContent=nm; }
}
function setWalking(on){
  walking=on; document.body.classList.toggle('walking',on);
  $('joy').hidden=!on; $('exitWalk').hidden=!on; $('walkHud').hidden=!on;
  if(on){
    S.floor='all'; S.ex=0; S.cut=27; S.xray=false; S.roof=true; syncUI(); applyState();
    P.x=17.75; P.y=66; P.z=0; P.yaw=0; P.pitch=0; tw=null; lastRoom='';
  } else { placeOrbit(); }
}

/* ---------- picking ---------- */
var ray=new T.Raycaster(), sel=null;
function pickAt(cx,cy){
  var rc=cvs.getBoundingClientRect(); var v=new T.Vector2(((cx-rc.left)/rc.width)*2-1,-((cy-rc.top)/rc.height)*2+1);
  ray.setFromCamera(v,cam);
  var list=PICK.filter(function(o){ var p=o; while(p){ if(!p.visible) return false; p=p.parent; } return true; });
  var hits=ray.intersectObjects(list,false);
  for(var i=0;i<hits.length;i++){ if(clip.constant<900&&hits[i].point.y>clip.constant) continue; return hits[i]; }
  return null;
}
function selectRoom(room){
  if(sel){ sel.mesh.forEach(function(m){ m.material.emissive.set(0x000000); }); sel=null; }
  if(!room){ $('infoName').textContent='Tap any room'; $('infoMeta').textContent='Drag to orbit · pinch to zoom · two fingers to pan'; $('infoTag').textContent=''; return; }
  var ms=FLOORS.filter(function(f){return f.userData.room===room;}); ms.forEach(function(m){ m.material.emissive.set(0x2a4f9a); }); sel={mesh:ms};
  var area=room.d?Math.round(room.d[0]*room.d[1]):null;
  $('infoName').textContent=room.n; $('infoMeta').textContent=(room.s?room.s:'Open to sky / service')+(area?'  ·  ≈ '+area+' sq ft':'');
  $('infoTag').textContent=room.lvl===0?'Ground floor':'First floor';
}

/* ---------- pointer input ---------- */
var ptrs=new Map(), moved=0, pinch=null, downAt=null;
cvs.addEventListener('contextmenu',function(e){e.preventDefault();});
cvs.addEventListener('pointerdown',function(e){
  try{cvs.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; tw=null; vth=vph=0; downAt={x:e.clientX,y:e.clientY,b:e.button};
  if(ptrs.size===2){ var a=Array.from(ptrs.values()); pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2}; }
});
cvs.addEventListener('pointermove',function(e){
  var p=ptrs.get(e.pointerId); if(!p) return; var dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  if(walking){ P.yaw+=dx*0.005; P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-dy*0.004)); return; }
  if(ptrs.size===2&&pinch){
    var a=Array.from(ptrs.values()), nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
    orb.r*=pinch.d/Math.max(nd,1); pan(mx-pinch.mx,my-pinch.my); pinch={d:nd,mx:mx,my:my}; clampOrbit();
  } else if(ptrs.size===1){
    if(e.buttons&2||e.shiftKey||(downAt&&downAt.b===2)) pan(dx,dy);
    else { orb.th-=dx*0.006; orb.ph-=dy*0.006; vth=-dx*0.006; vph=-dy*0.006; clampOrbit(); }
  }
});
function up(e){
  var had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(had&&ptrs.size===0&&moved<7&&!walking&&e.type==='pointerup'){ var h=pickAt(e.clientX,e.clientY); selectRoom(h&&h.object.userData.room?h.object.userData.room:null); vth=vph=0; }
}
cvs.addEventListener('pointerup',up); cvs.addEventListener('pointercancel',up);
cvs.addEventListener('wheel',function(e){ e.preventDefault(); if(walking) return; tw=null; orb.r*=Math.exp(e.deltaY*0.0012); clampOrbit(); },{passive:false});
window.addEventListener('keydown',function(e){ var k=e.key.toLowerCase(); keys[k]=true; if(walking&&['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault(); });
window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',function(){ keys={}; });
/* joystick */
(function(){
  var el=$('joy'), st=$('stick'), id=null, R=34;
  function set(e){ var r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, dx=e.clientX-cx, dy=e.clientY-cy, d=Math.hypot(dx,dy); if(d>R){dx*=R/d;dy*=R/d;} st.style.transform='translate('+dx+'px,'+dy+'px)'; joy.x=dx/R; joy.y=-dy/R; }
  el.addEventListener('pointerdown',function(e){ id=e.pointerId; el.setPointerCapture(id); set(e); e.preventDefault(); });
  el.addEventListener('pointermove',function(e){ if(e.pointerId===id) set(e); });
  function end(e){ if(e.pointerId!==id) return; id=null; joy.x=joy.y=0; st.style.transform='translate(0,0)'; }
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
})();

/* ---------- UI wiring ---------- */
function syncUI(){
  document.querySelectorAll('[data-floor]').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.floor===S.floor)); });
  document.querySelectorAll('[data-tog]').forEach(function(b){ b.setAttribute('aria-pressed',String(!!S[b.dataset.tog])); });
  $('slEx').value=S.ex; $('outEx').textContent=Math.round(S.ex*100)+'%'; $('slCut').value=S.cut; $('outCut').textContent=S.cut>=27?'off':S.cut.toFixed(1)+'′';
}
var curView='iso', roofAuto=false;
document.querySelectorAll('[data-view]').forEach(function(b){ b.addEventListener('click',function(){
  curView=b.dataset.view; document.querySelectorAll('[data-view]').forEach(function(x){ x.setAttribute('aria-pressed',String(x===b)); });
  if(curView==='top'&&S.roof){ S.roof=false; roofAuto=true; syncUI(); applyState(); } else if(curView!=='top'&&roofAuto){ S.roof=true; roofAuto=false; syncUI(); applyState(); }
  flyTo(PRE[curView]);
}); });
document.querySelectorAll('[data-floor]').forEach(function(b){ b.addEventListener('click',function(){ S.floor=b.dataset.floor; syncUI(); applyState(); }); });
document.querySelectorAll('[data-tog]').forEach(function(b){ b.addEventListener('click',function(){ var k=b.dataset.tog; S[k]=!S[k]; syncUI(); applyState(); }); });
$('slEx').addEventListener('input',function(e){ S.ex=parseFloat(e.target.value); syncUI(); applyState(); });
$('slCut').addEventListener('input',function(e){ S.cut=parseFloat(e.target.value); syncUI(); applyState(); });
$('btnReset').addEventListener('click',function(){
  if(walking) setWalking(false);
  S.floor='all'; S.roof=true; S.labels=true; S.furn=true; S.xray=false; S.ex=0; S.cut=27; syncUI(); applyState(); selectRoom(null);
  curView='iso'; document.querySelectorAll('[data-view]').forEach(function(x){ x.setAttribute('aria-pressed',String(x.dataset.view==='iso')); }); flyTo(PRE.iso);
});
$('btnWalk').addEventListener('click',function(){ setWalking(true); });
$('exitWalk').addEventListener('click',function(){ setWalking(false); });
$('toggleMore').addEventListener('click',function(){ var m=$('more'); m.hidden=!m.hidden; $('toggleMore').setAttribute('aria-expanded',String(!m.hidden)); $('toggleMore').textContent=m.hidden?'More controls':'Fewer controls'; });
if(window.innerWidth<640){ $('more').hidden=true; $('toggleMore').setAttribute('aria-expanded','false'); $('toggleMore').textContent='More controls'; }
S.night=!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);

/* ---------- loop ---------- */
function resize(){ var a=$('app'), w=a.clientWidth, h=a.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/Math.max(h,1); cam.updateProjectionMatrix(); }
if(window.ResizeObserver) new ResizeObserver(resize).observe($('app')); window.addEventListener('resize',resize); resize();
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(walking){ walkStep(dt); }
  else {
    stepTween(now);
    if(!tw&&ptrs.size===0&&(Math.abs(vth)>1e-4||Math.abs(vph)>1e-4)){ orb.th+=vth; orb.ph+=vph; vth*=0.92; vph*=0.92; clampOrbit(); }
    placeOrbit();
  }
  DOORS.forEach(function(d){
    var target=0.55;
    if(walking){ var near=Math.hypot(P.x-d.x,P.y-d.y)<5.5&&Math.abs(P.z-d.z)<4; target=near?1:0; }
    d.open+=(target-d.open)*Math.min(1,dt*6); d.piv.rotation.y=d.k*d.max*d.open;
  });
  renderer.render(scene,cam); requestAnimationFrame(frame);
}
resize(); orb.r=fitR(PRE.iso.r); syncUI(); applyState(); selectRoom(null); placeOrbit();
buildLabels();
if(document.fonts&&document.fonts.load){ Promise.race([Promise.all([document.fonts.load('600 40px "IBM Plex Sans"'),document.fonts.load('500 40px "IBM Plex Mono"')]),new Promise(function(r){setTimeout(r,1500);})]).then(buildLabels).catch(function(){}); }
requestAnimationFrame(frame);
window.__model={scene:scene,S:S,setWalking:setWalking,P:P,flyTo:flyTo,PRE:PRE,applyState:applyState,renderer:renderer};
})();
</script>
